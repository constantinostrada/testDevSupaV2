<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <!-- viewport-fit=cover + safe-area en el CSS: la barra inferior no queda
         debajo del home indicator del iPhone. Sin maximum-scale, para no
         bloquear el zoom de accesibilidad. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#12141a" />
    <meta name="description" content="Registro personal de gastos. Los datos quedan en este dispositivo." />
    <title>Gastos</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icon.svg" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="app-header">
      <h1>Gastos</h1>
      <p class="app-header__note" id="storage-note" hidden>
        Este navegador no permite guardar datos: lo que cargues se pierde al cerrar.
      </p>
    </header>

    <main class="app-main" id="main">
      <!-- Los dos totales se recalculan desde la lista en cada render: no hay
           total guardado que pueda quedar desfasado de los gastos. -->
      <section class="summary" id="summary" aria-label="Totales gastados">
        <div class="summary__totals">
          <div class="summary__block">
            <h2 class="summary__label">Hoy</h2>
            <p class="summary__total" id="summary-today">$ 0,00</p>
          </div>
          <div class="summary__block">
            <h2 class="summary__label">Este mes</h2>
            <p class="summary__total" id="summary-total">$ 0,00</p>
          </div>
        </div>
        <!-- El desglose es del mes: sin el titulo de seccion, lo dice el aria-label. -->
        <ul
          class="summary__categories"
          id="summary-categories"
          aria-label="Gastos del mes por categoría"
        ></ul>
      </section>

      <p class="notice" id="notice" role="alert" hidden></p>

      <p class="empty" id="empty-state">
        Todavía no cargaste gastos.<br />Tocá <strong>Nuevo gasto</strong> para empezar.
      </p>
      <ul class="expenses" id="expense-list" aria-label="Gastos cargados"></ul>
    </main>

    <!-- Barra fija al alcance del pulgar. El formulario se despliega desde
         abajo para que los controles queden en la mitad inferior. -->
    <div class="composer" id="composer">
      <div class="toast" id="undo-toast" role="status" hidden>
        <span class="toast__text">Gasto eliminado</span>
        <button type="button" class="toast__action" id="undo-btn">Deshacer</button>
      </div>

      <form class="composer__form" id="expense-form" hidden>
        <h2 class="composer__title" id="form-title">Nuevo gasto</h2>

        <div class="field">
          <label for="amount">Monto</label>
          <!-- inputmode=decimal abre el teclado numerico; font-size 16px en el
               CSS evita el auto-zoom de iOS al enfocar. -->
          <input
            id="amount"
            name="amount"
            type="text"
            inputmode="decimal"
            autocomplete="off"
            enterkeyhint="done"
            placeholder="0,00"
            required
          />
        </div>

        <div class="field">
          <span class="field__label" id="category-label">Categoría</span>
          <div class="chips" role="radiogroup" aria-labelledby="category-label" id="category-chips"></div>
        </div>

        <div class="field" id="date-field">
          <label for="date">Fecha</label>
          <input id="date" name="date" type="date" required />
        </div>

        <p class="error" id="form-error" role="alert" hidden></p>

        <div class="composer__actions">
          <button type="button" class="btn btn--ghost" id="cancel-btn">Cancelar</button>
          <button type="submit" class="btn btn--primary" id="submit-btn">Guardar</button>
        </div>
      </form>

      <button type="button" class="btn btn--primary btn--block" id="open-btn">
        + Nuevo gasto
      </button>
    </div>

    <script type="module" src="./js/app.js"></script>
  </body>
</html>
